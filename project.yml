name: OpenCodeIOS
options:
  bundleIdPrefix: com.h94676864
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  OpenCodeIOS:
    type: application
    platform: iOS
    sources:
      - Sources/OpenCodeIOS
    info:
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h94676864.opencodeios
        PRODUCT_NAME: OpenCodeIOS
        INFOPLIST_KEY_CFBundleDisplayName: "OpenCode"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "OpenCode uses your local network to connect to an OpenCode server running on your computer."
        GENERATE_INFOPLIST_FILE: YES
